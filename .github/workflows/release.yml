name: Release

# Build stripped binaries + optional crates.io publish when a GitHub Release
# is published (release-please creates the release on merge of its PR).
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0); empty = current HEAD"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: summa-x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: summa-aarch64-unknown-linux-gnu
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: summa-aarch64-apple-darwin
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: summa-x86_64-apple-darwin
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binary
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} -p summa-import --bin summa
          else
            cargo build --locked --release --target ${{ matrix.target }} -p summa-import --bin summa
          fi

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/summa"
          if [ ! -f "$BIN" ]; then
            BIN="target/${{ matrix.target }}/release/summa.exe"
          fi
          STAGE="dist/${{ matrix.asset }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/summa"
          chmod +x "$STAGE/summa" || true
          cp README.md LICENSE CHANGELOG.md "$STAGE/" 2>/dev/null || true
          (
            cd dist
            tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          )
          ls -lah "dist/${{ matrix.asset }}.tar.gz"
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"
          # strip already applied via profile; record size for release notes
          du -h "$STAGE/summa" | tee dist/size-${{ matrix.asset }}.txt

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/size-${{ matrix.asset }}.txt

  publish-nightly:
    name: Publish beta channel binaries
    runs-on: ubuntu-latest
    needs: [build-binaries]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: summa-*
          path: dist
          merge-multiple: true

      - name: List beta assets
        run: find dist -type f | sort

      # Every master build lands on the rolling `beta` tag (beta channel).
      # release-please tagged releases are the stable channel.
      - name: Publish rolling beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          name: beta
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Rolling `beta` binaries from master (${{ github.sha }}).
            Install: `curl -fsSL https://summa.duyet.net/install.sh | SUMMA_CHANNEL=beta bash`
            Update: `summa update --beta`. Stable stays on release-please tags.

            ```bash
            curl -fsSL https://raw.githubusercontent.com/duyet/summa/master/install.sh | bash
            curl -fsSL https://summa.duyet.net/install.sh | bash
            ```
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-please creates versioned releases without binaries (its token
      # does not retrigger the `release` event). Backfill the stable channel:
      # if the tagged release for the built Cargo version has no tarballs,
      # attach them so `SUMMA_CHANNEL=stable` / `summa update --stable` work.
      - name: Backfill stable release assets
        run: |
          set -euo pipefail
          VER="$(grep -m1 '^version' apps/cli/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          TAG="v${VER}"
          echo "stable tag: ${TAG}"
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "${COUNT}" != "0" ]; then
            echo "already has ${COUNT} asset(s); skipping backfill"
            exit 0
          fi
          cp dist/*.tar.gz dist/*.sha256 .
          gh release upload "${TAG}" ./*.tar.gz ./*.sha256 --clobber
          rm -f ./*.tar.gz ./*.sha256
          echo "backfilled stable ${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-binaries]
    # Only on real GitHub Releases, and only when the token secret is set.
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: crates-io-publish

      - name: cargo package -p summa-import (verify)
        run: cargo package --locked -p summa-import --list | head -100

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            echo "Add the secret under repo Settings → Secrets to enable."
            exit 0
          fi
          cargo publish --locked -p summa-import
